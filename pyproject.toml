# Workspace root: ties together the `aimlabs` library (./model) and the
# training pipelines (./training) so a single `uv sync` sets up everything.
[project]
name = "aimlabs-workspace"
version = "0.0.0"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["model", "training"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (replaces the standalone bandit workflow)
    "RUF", # ruff-specific
]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["aimlabs", "common"]

[tool.pytest.ini_options]
testpaths = ["model/tests", "training/tests"]
addopts = "-ra"
pythonpath = ["training/scripts"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["model/src"]
