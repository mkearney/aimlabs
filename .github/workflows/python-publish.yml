# Builds the `aimlabs` package and publishes it to PyPI when a release is
# published. Uses PyPI trusted publishing (OIDC), so no API token is needed:
# configure the publisher at https://pypi.org/manage/account/publishing/
name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --package aimlabs
      - run: uv publish
