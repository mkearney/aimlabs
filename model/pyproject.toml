[project]
name = "aimlabs"
version = "0.2.0"
description = "Fine-tune and serve transformer-based text classification models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael W. Kearney" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "structlog>=23.1",
    "torch>=2.1",
    "transformers>=4.36",
]

[project.urls]
Repository = "https://github.com/mkearney/aimlabs"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimlabs"]
